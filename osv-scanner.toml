# osv-scanner allowlist -- Evidentia supply-chain pre-push gate.
#
# Consumed by `scripts/run_osv_scan.py` via `osv-scanner --config`.
# That one shared script runs the gate in CI (the `osv-scan` job in
# .github/workflows/test.yml) and pre-tag (docs/release-checklist.md
# Step 5), so the CI gate and its documented counterpart cannot drift.
#
# osv-scanner surfaces transitive + DISPUTED advisories that the
# Dependabot alert feed suppresses (see the v0.9.8 gate-fidelity
# lesson: a disputed pyjwt CVE surfaced only post-tag because the
# 16-row gate's Row 14 read Dependabot alerts).
#
# Every [[IgnoredVulns]] entry MUST carry a `reason` traceable to a
# security-review disposition. `ignoreUntil` forces re-validation:
# once it lapses the gate fails until the entry is re-affirmed or
# removed. osv-scanner also suppresses aliases of an ignored id.

[[IgnoredVulns]]
id = "PYSEC-2025-183"
ignoreUntil = 2026-11-21
reason = "pyjwt CVE-2025-45768: DISPUTED, no fix exists. The pyjwt maintainer disputes the advisory (HMAC key length is the calling application's choice, not a library defect); every pyjwt release is flagged, so there is no first_patched version. pyjwt reaches Evidentia only transitively (sigstore / mcp / msal / okta / pygithub / snowflake-connector-python) and Evidentia exposes no operator-chosen-key JWT-minting surface. Operator-confirmed accept 2026-05-21 (docs/security-review-v0.9.8.md); re-affirmed for v0.9.9. Re-validate by 2026-11-21."

# Accepted MEDIUM. REMOVAL TRIGGER: drop this entry + bump tuf to >=7.0.0
# as soon as sigstore ships a release that supports tuf-7 (the fix is
# upstream-blocked today because sigstore 4.2.0 pins `tuf~=6.0`). Tracked in
# the v0.10.8 backlog; the `reason` below carries the full disposition.
[[IgnoredVulns]]
id = "GHSA-qp9x-wp8f-qgjj"
ignoreUntil = 2026-11-29
reason = "tuf 6.0.0 (CVSS 4.0 MEDIUM, 'platform-dependent delegation path matching'). Newly disclosed 2026-05-28 (v0.10.6 was osv-clean 2026-05-27). FIX (tuf 7.0.0) is UPSTREAM-BLOCKED: the latest sigstore release (4.2.0) pins `tuf~=6.0`, so no resolvable path to tuf 7.x exists until sigstore ships a tuf-7-compatible release (verified: `uv lock --upgrade-package sigstore --upgrade-package tuf` is a no-op; PyPI sigstore 4.2.0 requires `tuf~=6.0`). tuf reaches Evidentia only transitively via sigstore's keyless trust-root fetch (signature verification); Evidentia exposes no operator-controlled tuf delegation/target-path surface, so the platform-dependent path-matching weakness is not reachable from any Evidentia entry point. Operator-confirmed accept 2026-05-29 (v0.10.7 cycle). REMOVE this entry + bump tuf to >=7.0.0 as soon as sigstore releases tuf-7 support (tracked in v0.10.8 backlog). Re-validate by 2026-11-29."

# Accepted MEDIUM x2 (aiohttp client-side cookie CVEs). REMOVAL TRIGGER: drop
# both entries + let aiohttp float to >=3.14.0 as soon as litellm relaxes its
# `aiohttp==3.13.4` exact pin (the fix is upstream-blocked today because even the
# latest litellm 1.87.1 still exact-pins aiohttp==3.13.4). Tracked in the v0.10.9
# backlog; the `reason` fields below carry the full disposition.
[[IgnoredVulns]]
id = "GHSA-hg6j-4rv6-33pg"
ignoreUntil = 2026-12-04
reason = "aiohttp 3.13.4 (CVSS 6.6, CWE-346 origin-validation): the aiohttp CLIENT transmits per-request cookies across cross-origin redirects, potentially exposing them to a redirect target. FIXED in aiohttp 3.14.0 but UPSTREAM-BLOCKED: aiohttp reaches Evidentia only transitively, and litellm exact-pins `aiohttp==3.13.4` even in its latest release 1.87.1 (verified: `uv lock --upgrade-package litellm` bumps litellm 1.83.14->1.87.1 yet aiohttp stays 3.13.4; instructor `<4.0,>=3.9.1` and okta `>=3.12.14` both already allow 3.14.0 -- only litellm blocks it). NOT REACHABLE from Evidentia: no direct `import aiohttp` in any Evidentia source, and the transitive aiohttp clients (litellm/instructor/okta) authenticate to operator-configured endpoints via header auth (Bearer / SSWS token / OAuth), not the per-request-`cookies=` + cross-origin-redirect flow this weakness requires. Operator-confirmed accept 2026-06-04 (v0.10.8 cycle, docs/security-review-v0.10.8.md). REMOVE both aiohttp entries + let aiohttp float to >=3.14.0 as soon as litellm relaxes the aiohttp==3.13.4 pin. Re-validate by 2026-12-04."

[[IgnoredVulns]]
id = "GHSA-jg22-mg44-37j8"
ignoreUntil = 2026-12-04
reason = "aiohttp 3.13.4 (CVSS 6.4, CWE-502 deserialization): `aiohttp.CookieJar.load()` on untrusted input may allow arbitrary code execution. FIXED in aiohttp 3.14.0 but UPSTREAM-BLOCKED by litellm's exact `aiohttp==3.13.4` pin (see the GHSA-hg6j-4rv6-33pg entry above for the full upstream-block analysis -- the latest litellm 1.87.1 still exact-pins 3.13.4). NOT REACHABLE from Evidentia: no Evidentia source calls `CookieJar.load()` (grep-confirmed 0 `CookieJar` usages across packages/*/src), no Evidentia source imports aiohttp directly, and the transitive aiohttp clients (litellm/instructor/okta) do not load cookie jars from untrusted files in their LLM / Okta API flows -- the deserialization sink is never fed attacker-controlled input. Operator-confirmed accept 2026-06-04 (v0.10.8 cycle, docs/security-review-v0.10.8.md). REMOVE both aiohttp entries + let aiohttp float to >=3.14.0 as soon as litellm relaxes the aiohttp==3.13.4 pin. Re-validate by 2026-12-04."
