# osv-scanner allowlist -- Evidentia supply-chain pre-push gate.
#
# Consumed by `scripts/run_osv_scan.py` via `osv-scanner --config`.
# That one shared script runs the gate in CI (the `osv-scan` job in
# .github/workflows/test.yml) and pre-tag (docs/release-checklist.md
# Step 5), so the CI gate and its documented counterpart cannot drift.
#
# osv-scanner surfaces transitive + DISPUTED advisories that the
# Dependabot alert feed suppresses (see the v0.9.8 gate-fidelity
# lesson: a disputed pyjwt CVE surfaced only post-tag because the
# 16-row gate's Row 14 read Dependabot alerts).
#
# Every [[IgnoredVulns]] entry MUST carry a `reason` traceable to a
# security-review disposition. `ignoreUntil` forces re-validation:
# once it lapses the gate fails until the entry is re-affirmed or
# removed. osv-scanner also suppresses aliases of an ignored id.

[[IgnoredVulns]]
id = "PYSEC-2025-183"
ignoreUntil = 2026-11-21
reason = "pyjwt CVE-2025-45768: DISPUTED, no fix exists. The pyjwt maintainer disputes the advisory (HMAC key length is the calling application's choice, not a library defect); every pyjwt release is flagged, so there is no first_patched version. pyjwt reaches Evidentia only transitively (sigstore / mcp / msal / okta / pygithub / snowflake-connector-python) and Evidentia exposes no operator-chosen-key JWT-minting surface. Operator-confirmed accept 2026-05-21 (docs/security-review-v0.9.8.md); re-affirmed for v0.9.9. Re-validate by 2026-11-21."

# (v0.10.10) The accepted tuf MEDIUM (GHSA-qp9x-wp8f-qgjj, "platform-dependent
# delegation path matching", accepted 2026-05-29 in the v0.10.7 cycle) was
# REMOVED: its documented removal trigger fired — sigstore 4.3.0 relaxed its
# `tuf~=6.0` pin to `tuf<8,>=6`, so `uv lock --upgrade-package sigstore
# --upgrade-package tuf` now floats sigstore to 4.3.0 and tuf to 7.0.0 (the
# fix release). tuf is no longer flagged by osv-scanner.

# (v0.10.9) The two accepted aiohttp client-cookie CVEs (GHSA-hg6j-4rv6-33pg
# + GHSA-jg22-mg44-37j8, accepted 2026-06-04 in the v0.10.8 cycle) were
# REMOVED 2026-06-10: their documented removal trigger fired — litellm 1.88.1
# relaxed the exact `aiohttp==3.13.4` pin to `aiohttp<4.0,>=3.10`, so aiohttp
# now floats to 3.14.1 (>= the 3.14.0 fix release) in uv.lock.

# Accepted LOW (GitHub-reviewed severity LOW; CVSS3.1 5.3 AV:L). No fixed
# version exists (the affected range runs through the latest torch 2.12.0),
# so there is no upgrade path to clear it. REMOVAL TRIGGER: torch ships a
# release excluded from GHSA-rrmf-rvhw-rf47's affected range (or the
# advisory is withdrawn).
[[IgnoredVulns]]
id = "GHSA-rrmf-rvhw-rf47"
ignoreUntil = 2026-12-10
reason = "torch 2.11.0 (CVE-2025-3000 / PYSEC-2025-194, CVSS3.1 5.3 AV:L, CWE-119): local-only memory corruption in torch.jit.script on attacker-supplied script input (VulDB-sourced, pytorch/pytorch#149623). NVD-published 2025-03-31 but only GitHub-reviewed 2026-06-10 (github_reviewed_at 18:02 UTC), which is why it first surfaces in this scan. NO FIX EXISTS: the affected range covers every torch release through the latest 2.12.0, so no upgrade clears it. NOT REACHABLE from Evidentia: torch is transitive-only (sentence-transformers <- evidentia-eval [faithfulness-semantic] optional extra), zero 'torch' references in any packages/*/src source (grep-confirmed 2026-06-10), Evidentia never invokes torch.jit.script and never compiles TorchScript from untrusted input -- sentence-transformers uses torch for embedding inference on operator-chosen models only; the attack additionally requires local code execution (AV:L), at which point the attacker already runs code locally. Operator-confirmed accept 2026-06-10 (v0.10.9 cycle). Re-validate by 2026-12-10."

# (v0.10.10) Accepted nominal HIGH that is AVAILABILITY-ONLY and absent from every
# shipped artifact. CWE-125 out-of-bounds READ in the OpenSSL statically bundled
# into cryptography's PyPI wheels (wheel-only -- sdist builds use system OpenSSL).
# Fixed in cryptography 48.0.1. The fix is GRAPH-BLOCKED upstream and the vuln is
# NOT in anything Evidentia ships. Full reachability proof: docs/security-review-v0.10.10.md.
[[IgnoredVulns]]
id = "GHSA-537c-gmf6-5ccf"
ignoreUntil = 2026-09-15
reason = "cryptography GHSA-537c-gmf6-5ccf (CVSS3.1 7.5 AV:N but C:N/I:N/A:H -- availability-only DoS; CWE-125 out-of-bounds read in the OpenSSL statically bundled into cryptography PyPI wheels; wheel-only, no CVE assigned; affects >=0.5.0,<48.0.1, fixed in 48.0.1). NO REACHABLE UPGRADE PATH: py-ocsf-models 0.9.0 -- the only release on PyPI, pulled solely by Evidentia's optional [ocsf] extra -- hard-caps cryptography>=44.0.3,<47, pinning the full-extras dev resolution to 46.0.7; uv cannot float cryptography to 48.x without making the workspace lock unsatisfiable (resolver-trace-confirmed 2026-06-15). NOT IN ANY SHIPPED ARTIFACT: the container installs evidentia[gui] (= evidentia-api) and base `pip install evidentia` is core-only -- neither pulls cryptography because BOTH sigstore and ocsf are opt-in extras, so docker/requirements.txt carries no cryptography and the container-build osv gate is clean; cryptography 46.0.7 surfaces ONLY in this full-extras dev SBOM (sigstore+ocsf+collectors[all] resolved together). NOT REACHABLE from Evidentia code even on the affected combo: the only `import cryptography` in any packages/*/src is oscal/sigstore.py (`from cryptography import x509`); the [ocsf] mapping module that pulls 46.0.7 never imports cryptography (grep-confirmed 2026-06-15). Installed via [sigstore] alone, cryptography floats to 48.x (the FIX) since only ocsf caps <47; worst case ([sigstore,ocsf] together) is a DoS-only OOB read during an explicit operator sign/verify on a malicious Fulcio cert -- no server-side surface, no data exposure. REMOVAL TRIGGER: py-ocsf-models ships a release relaxing the cryptography<47 cap (filed upstream 2026-06-16 as prowler-cloud/py-ocsf-models#300; then `uv lock --upgrade-package py-ocsf-models --upgrade-package cryptography` floats to >=48.0.1), or the advisory is withdrawn. Operator-confirmed accept 2026-06-15 (v0.10.10 cycle). Re-validate by 2026-09-15."
