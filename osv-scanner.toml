# osv-scanner allowlist -- Evidentia supply-chain pre-push gate.
#
# Consumed by `scripts/run_osv_scan.py` via `osv-scanner --config`.
# That one shared script runs the gate in CI (the `osv-scan` job in
# .github/workflows/test.yml) and pre-tag (docs/release-checklist.md
# Step 5), so the CI gate and its documented counterpart cannot drift.
#
# osv-scanner surfaces transitive + DISPUTED advisories that the
# Dependabot alert feed suppresses (see the v0.9.8 gate-fidelity
# lesson: a disputed pyjwt CVE surfaced only post-tag because the
# 16-row gate's Row 14 read Dependabot alerts).
#
# Every [[IgnoredVulns]] entry MUST carry a `reason` traceable to a
# security-review disposition. `ignoreUntil` forces re-validation:
# once it lapses the gate fails until the entry is re-affirmed or
# removed. osv-scanner also suppresses aliases of an ignored id.

# (v0.10.18) The disputed pyjwt entry (PYSEC-2025-183, accepted 2026-05-21,
# re-affirmed v0.9.9) was REMOVED 2026-07-14: the advisory's affected range was
# bounded upstream to last_affected 2.10.1 (previously every release was
# flagged with no first_patched version), and the locked pyjwt is 2.13.0 —
# outside the range (OSV API confirmed; osv-scanner reported the entry as an
# unused ignore). Re-add with a fresh disposition if the range widens again.

# (v0.10.10) The accepted tuf MEDIUM (GHSA-qp9x-wp8f-qgjj, "platform-dependent
# delegation path matching", accepted 2026-05-29 in the v0.10.7 cycle) was
# REMOVED: its documented removal trigger fired — sigstore 4.3.0 relaxed its
# `tuf~=6.0` pin to `tuf<8,>=6`, so `uv lock --upgrade-package sigstore
# --upgrade-package tuf` now floats sigstore to 4.3.0 and tuf to 7.0.0 (the
# fix release). tuf is no longer flagged by osv-scanner.

# (v0.10.9) The two accepted aiohttp client-cookie CVEs (GHSA-hg6j-4rv6-33pg
# + GHSA-jg22-mg44-37j8, accepted 2026-06-04 in the v0.10.8 cycle) were
# REMOVED 2026-06-10: their documented removal trigger fired — litellm 1.88.1
# relaxed the exact `aiohttp==3.13.4` pin to `aiohttp<4.0,>=3.10`, so aiohttp
# now floats to 3.14.1 (>= the 3.14.0 fix release) in uv.lock.

# (v0.10.18) The accepted torch LOW (GHSA-rrmf-rvhw-rf47 / CVE-2025-3000,
# accepted 2026-06-10 in the v0.10.9 cycle) was REMOVED 2026-07-14: its
# documented removal trigger fired — torch 2.13.0 (floated by the setuptools
# PYSEC-2026-3447 fix bump) is outside the advisory's affected range
# (last_affected 2.12.0, OSV API confirmed; osv-scanner reported the entry as
# an unused ignore).

