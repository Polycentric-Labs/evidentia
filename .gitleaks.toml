# Gitleaks configuration for Evidentia (v0.10.8 A4).
#
# Complements the local pre-push secret scan
# (scripts/pre_push/check_secrets.sh) with a CI-side gitleaks scan
# (.github/workflows/secret-scan.yml) so a committed credential is caught
# on every push/PR, independent of whether a contributor has the local
# pre-push hook configured.
#
# `useDefault = true` inherits the full upstream gitleaks default ruleset
# (AWS keys, GitHub/GitLab PATs, private keys, Slack/Stripe tokens, generic
# high-entropy assignments, etc.). We only layer an allowlist on top — no
# custom detection rules are defined here, so the scan stays in lockstep
# with upstream rule improvements.

title = "Evidentia gitleaks config"

[extend]
# Pull in the built-in ruleset shipped with the gitleaks binary. Project
# rules below (none currently) would be MERGED with the defaults rather
# than replacing them.
useDefault = true

# Keep the scan signal-not-noise: test fixtures and example assets carry
# deliberately fake/sample tokens (e.g. an OCSF ingestion fixture, a sample
# collector config) that are not real credentials. Allowlisting these paths
# stops them tripping the generic high-entropy and provider-token rules.
# `paths` entries are regexes matched against each candidate's file path
# (forward-slash form, repo-relative). Real source, docker/, packages/,
# and docs/ are intentionally NOT allowlisted — a secret there is a finding.
[allowlist]
description = "Allowlist known-safe test fixtures and example assets"
paths = [
    # tests/fixtures/** and any nested tests/<sub>/fixtures/** tree.
    '''tests/(.*/)?fixtures/.*''',
    # Example assets shipped under examples/.
    '''examples/.*''',
    # Test MODULES that embed deliberately-fake credentials as part of the
    # test body itself (triaged 2026-06-05 when the gitleaks scan first ran
    # end-to-end: all placeholders, verified NOT real secrets):
    #   - test_logger.py is the secret-SCRUBBER test — it intentionally feeds
    #     AWS-documented placeholder keys + a fake GitHub-PAT-shaped string
    #     through the scrubber to assert redaction (the module says so and
    #     splits the AWS literal to dodge scanners).
    #   - test_gaps.py / test_sse_endpoints.py use fake 16-hex `report_key`
    #     test values that the generic-api-key high-entropy rule trips on.
    #   - test_gap_report_repository_router.py / test_gap_store_repository.py
    #     (v0.12 explicit-root gap-report repository seam) use the same fake
    #     16-hex report-key shape (`"0123456789abcdef"` in a `key` parametrize)
    #     — the generic-api-key rule fired on it 2026-08-17. NOTE: the CI scan
    #     fetches every branch and runs `gitleaks git` over the whole history,
    #     so a false positive on ANY pushed branch fails the required check
    #     for EVERY open PR — allowlist by module here, not per-branch.
    # Scoped to these exact modules so real source/config stays fully scanned.
    '''tests/unit/test_audit/test_logger\.py''',
    '''tests/integration/test_api/test_gaps\.py''',
    '''tests/integration/test_api/test_sse_endpoints\.py''',
    '''tests/integration/test_api/test_gap_report_repository_router\.py''',
    '''tests/unit/test_gap_analyzer/test_gap_store_repository\.py''',
]

# Value-precise regex allowlist (matched against the detected SECRET, NOT the
# file path — so real source stays fully scanned). The generic-api-key
# high-entropy rule trips on pyca/cryptography public TYPE NAMES used in the
# OSCAL air-gap signing module's type aliases / annotations, e.g.
# `_PrivateKey = Ed25519PrivateKey | RSAPrivateKey` (keysign.py). These are
# class names exported by the `cryptography` library — never credentials.
# Scoped to these exact tokens, so a genuine high-entropy secret anywhere
# (including the same file) still flags.
regexes = [
    '''Ed25519PrivateKey''',
    '''RSAPrivateKey''',
    '''Ed25519PublicKey''',
    '''RSAPublicKey''',
]
