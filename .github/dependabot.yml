# Dependabot configuration for Evidentia.
#
# Security updates run regardless of this file (GitHub auto-detects
# manifests for security advisories). This file enables and configures
# regular VERSION updates — periodic non-security bumps that keep deps
# current.
#
# Conventions:
#   - Weekly cadence (Monday 06:00 ET) — single batch to triage at the
#     start of the week, not a daily drip.
#   - Grouped updates (one PR per group, not per package) — turns ~10
#     individual PRs into a few reviewable batches.
#   - Per-ecosystem open-PR cap so the queue can't run away.
#   - Conventional-commit prefixes so release-automation tooling parses
#     the bump-type correctly.
#
# Isolation strategy (added after the v0.10.12/13 cycle, where pydantic
# 2.13, typer 0.26, and click 8.2 — all breaking *minors* — rode an
# 18-package group bump and broke CI before the break was visible):
#   - `cooldown` holds a freshly published release for a few days so a
#     yanked / hotfixed bad release is superseded before Dependabot
#     proposes it (longer for majors than patches). Security advisories
#     bypass cooldown (they are not version updates).
#   - `update-types: [minor, patch]` on the routine groups raises every
#     *major* as its own PR — a major is never buried in a batch.
#   - A dedicated `python-frameworks` group pulls the breaking-prone
#     web/CLI core (pydantic / fastapi / starlette / typer / click /
#     uvicorn / httpx) into a small, separately-reviewable PR. A
#     major-only split would NOT have caught the breaking *minors* that
#     bit us; isolating these packages by name does. Their version
#     upper-bound caps + human review (auto-merge is off) are the
#     complementary guards.
#
# Security update PRs are NEVER grouped (see `applies-to: version-updates`
# scope on each group below) — each advisory deserves its own PR with a
# clear advisory reference, per the v0.7.2 supply-chain follow-up
# pattern (commit 8baa93d).

version: 2
updates:

  # ---------------------------------------------------------------------
  # Python (uv workspace — covers all 7 pyproject.toml files via uv.lock)
  # ---------------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "python:uv"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Breaking-prone web/CLI framework core — its own small PR, never
      # buried in the routine batch (the pydantic/typer/click break class).
      python-frameworks:
        applies-to: version-updates
        patterns:
          - "pydantic*"
          - "fastapi"
          - "starlette"
          - "typer"
          - "click"
          - "uvicorn*"
          - "httpx*"
      python-runtime:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "pydantic*"
          - "fastapi"
          - "starlette"
          - "typer"
          - "click"
          - "uvicorn*"
          - "httpx*"
      python-dev:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # A group's `update-types` filter does not reliably keep a major out
    # of a uv re-lock: an uncapped direct dependency can still move to a
    # new major when the group's lock is regenerated. `mcp` did exactly
    # that — 1.28.1 -> 2.0.0 rode the routine python-dev batch and put
    # PRs #236, #243 and #249 red on pytest + mypy in turn, blocking 12
    # innocent dev bumps behind one breaking major. The root pyproject
    # now caps `mcp>=1.28.1,<2.0` (the SDK's own recommendation for
    # projects not yet migrated), which is the real fix; this ignore is
    # the belt-and-braces half, so a future uncapped path cannot
    # reintroduce the same batch-poisoning.
    # REMOVAL TRIGGER: the tracked "mcp SDK 2.0 migration" item in
    # docs/ROADMAP.md lands — then drop this entry AND the pyproject cap
    # together, in that migration's own PR.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"

  # ---------------------------------------------------------------------
  # Frontend (npm — packages/evidentia-ui)
  # ---------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/packages/evidentia-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-runtime:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-dev:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Same batch-poisoning pattern as `mcp` above, on the npm side:
    # @tanstack/react-table 8.21.3 -> 9.1.2 is a breaking major that rode
    # the 20-package npm-runtime group (PRs #234, #242), failing the
    # frontend typecheck + build check and holding 19 unrelated runtime
    # bumps hostage. v9 restructures the table API that GapTable.tsx is
    # built on, so it is a deliberate migration, not a bump.
    # REMOVAL TRIGGER: the tracked "react-table v9 migration (GapTable)"
    # item in docs/ROADMAP.md lands — drop this entry in that PR.
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types:
          - "version-update:semver-major"

  # ---------------------------------------------------------------------
  # GitHub Actions (workflow files in .github/workflows/)
  # ---------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # Docker (the repo-root Dockerfile + any future container builds)
  # ---------------------------------------------------------------------
  # The python:3.13 -> 3.14 base bump (#83) that broke the v0.10.12
  # container is exactly the class cooldown + human review now guard:
  # the smoke test (un-broken in v0.10.13) catches the build break, and
  # cooldown lets a base-image tag settle before it is proposed.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # python base-image VERSION bumps (3.13 -> 3.14 is semver-MINOR in
      # Dependabot's classification, the major stays 3, so major-only
      # ignoring would not catch it; #127 arrived through the minor+patch
      # group). Base-image moves stay a deliberate maintainer decision even
      # now that the stack itself runs on 3.14 (requires-python <3.15 since
      # v0.13): the v0.10.12 container break (engineering-practices lesson 1;
      # PR #127 closed on this basis) came from an unreviewed base bump, and
      # the DHI runtime digest must move in step with the builder tag, so a
      # 3.14 base is a scheduled migration once DHI 3.14 coverage is
      # confirmed, not a Dependabot PR. Digest bumps are NOT version-updates
      # and continue to flow. Both FROM lines are covered: the
      # python:3.13-slim builder AND the dhi.io/python runtime base.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "dhi.io/python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
