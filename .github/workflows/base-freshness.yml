# Base-image freshness sentinel. DETECTS + NUDGES only — it never rebuilds or
# republishes (that would violate the atomic-release / immutable-digest /
# human-review doctrine). It complements Dependabot-docker (digest-bump PRs) and
# post-publish-rescan.yml (fixable day-N CVEs) with the one signal neither
# provides: a TIME-based staleness nudge. When the pinned DHI base digest drifts
# from the current dhi.io/python:3.13, or the latest GitHub Release is older than
# 90 days, it opens/updates a single tracking issue: "cut a patch release to
# rebuild on the fresh base". It also detects dead or never-fired workflow
# trigger events (lesson 9, G10), and its own liveness is in turn asserted
# weekly by post-publish-rescan.yml's sentinel-liveness job.
name: base freshness

on:
  schedule:
    - cron: "23 8 * * 2"   # Tuesdays 08:23 UTC (offset from the Mon rescan)
  workflow_dispatch: {}

# Write scopes are JOB-scoped below (zizmor excessive-permissions: a multi-job
# workflow must not hold workflow-level write).
permissions:
  contents: read

concurrency:
  group: base-freshness
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    # Opens/updates the freshness tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (Dockerfile pin)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate base freshness + published-image age
        id: eval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_DAYS: "90"
        run: |
          set -euo pipefail
          # 1) The pinned DHI digest — anchor on the DHI FROM line SPECIFICALLY
          #    (the Dockerfile has two @sha256 FROMs: slim builder + DHI final).
          pinned=$(grep -oE 'dhi\.io/python:3\.13@sha256:[0-9a-f]{64}' Dockerfile || true)
          count=$(printf '%s\n' "$pinned" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one 'FROM dhi.io/python:3.13@sha256:' line, found ${count}"
            exit 1
          fi
          pinned_digest="${pinned#*@}"
          # 2) The current upstream digest (anonymous — dhi.io serves public repos
          #    via an anonymous bearer token). Fail-soft: if the registry is ever
          #    unreachable or gated, skip the digest-drift compare (keep the age
          #    nudge) rather than turning this scheduled job chronically red.
          current_digest=$(docker buildx imagetools inspect dhi.io/python:3.13 \
            --format '{{ .Manifest.Digest }}' 2>/dev/null || echo "")
          # 3) Latest release age.
          published=$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json publishedAt -q .publishedAt 2>/dev/null || echo "")
          reasons=""
          if [ -n "$current_digest" ] && [ "$pinned_digest" != "$current_digest" ]; then
            reasons="${reasons}- Base digest drifted: pinned \`${pinned_digest}\` != current \`${current_digest}\`\n"
          fi
          if [ -n "$published" ]; then
            age_days=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 86400 ))
            if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
              reasons="${reasons}- Published image age ${age_days}d > ${MAX_AGE_DAYS}d (latest release ${published})\n"
            fi
          fi
          if [ -n "$reasons" ]; then
            { echo "stale=true"; echo "reasons<<EOF"; printf '%b' "$reasons"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Base fresh + image within age budget; nothing to do."
          fi

      - name: Open or update the tracking issue
        if: steps.eval.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASONS: ${{ steps.eval.outputs.reasons }}
        run: |
          set -euo pipefail
          TITLE="Container base freshness: rebuild due"
          BODY=$(printf '%b\n\n%s\n' \
            "The DHI container base or the published image is stale:\n\n${REASONS}" \
            "Action: cut a patch release to rebuild on the fresh base (Dependabot may already have a digest-bump PR open). This is a scheduled sentinel — not a gate. See docs/engineering-practices.md (Continuous security assurance).")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number -q '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

  # G10 (engineering-practices lesson 9): a gate is not real until observed
  # firing. Flags (i) structurally dead trigger events (a `release:` trigger
  # in a repo whose Releases are GITHUB_TOKEN-created) and (ii) declared
  # automatic triggers with zero runs ever after a 30-day grace window.
  # Detect-and-nudge only — findings go to one tracking issue, never a red run.
  workflow-liveness:
    name: Workflow liveness (dead / never-fired triggers)
    runs-on: ubuntu-latest
    # Opens/updates the liveness tracking issue; reads the runs API.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout (workflow files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Detect dead / never-fired trigger events
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --no-sync python scripts/check_workflow_liveness.py \
            --repo "$GITHUB_REPOSITORY" --output liveness-findings.md

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s liveness-findings.md ]; then
            echo "No liveness findings — nothing to do."
            exit 0
          fi
          TITLE="Workflow liveness: dead or never-fired triggers"
          BODY=$(printf '%s\n\n%s\n' \
            "$(cat liveness-findings.md)" \
            "Action: rewire or remove the dead trigger (see docs/engineering-practices.md lesson 9). This is a scheduled sentinel — not a gate.")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number -q '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
