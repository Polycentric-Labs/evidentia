name: release

on:
  push:
    tags:
      - "v*"

# Workflow-level least-privilege default. Each publish job elevates locally.
# Closes OpenSSF Scorecard alert #30 (no top-level permission defined).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress: false so any re-fired release run (e.g. re-running a
  # failed publish) queues BEHIND an in-flight run rather than cancelling a job
  # mid-publish. Note: moving or deleting a published v* tag is now blocked
  # server-side by the "Protect release tags (v*)" ruleset + GitHub Immutable
  # Releases, so the historical v0.10.3 / v0.10.8 move-tag re-fire recovery no
  # longer applies — recovery is yank + a forward patch
  # (see docs/runbooks/release-rollback.md).
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# v0.10.14 — ATOMIC RELEASE reorder (the "PyPI-only release" lesson).
#
# v0.10.12 published all 8 wheels to PyPI and THEN the container job built FROM
# PyPI and FAILED (a python:3.14/litellm base regression), leaving a PyPI-only
# release. Two structural causes: (1) the container built AFTER the irreversible
# PyPI publish, and (2) it built FROM PyPI, so it also raced PyPI propagation.
#
# This workflow now builds + validates EVERY artifact BEFORE the publish:
#
#   tag-guard ─▶ gate ─▶ build ──────────────▶ publish-pypi ─▶ publish-container
#                        (wheels + SBOM +      (download +      (load the EXACT
#                         container built       provenance +     validated image,
#                         FROM LOCAL WHEELS,     publish to       push, sign,
#                         smoke-tested,          PyPI)            create the
#                         saved as an artifact)                   Release LAST)
#
# - The container is built FROM THE LOCALLY-BUILT WHEELS (docker/wheels), never
#   from PyPI, so it has no PyPI-propagation dependency and a base/dep failure
#   surfaces in `build`, BEFORE publish-pypi runs.
# - publish-pypi `needs: build`, so a container-build failure blocks the
#   irreversible PyPI publish entirely.
# - publish-container LOADS the byte-identical image `build` validated (docker
#   save/load) — no post-publish rebuild — then pushes + signs + attests it.
# - The GitHub Release is created ONCE, LAST, by publish-container: a half-
#   finished release leaves no Release page (fail-loud + recoverable) rather
#   than a wheels-only Release that silently omits the container.
# ---------------------------------------------------------------------------

jobs:
  # Accidental-publish hardening (v0.10.12 Wave 0b). The trigger is tags:['v*'],
  # so any v-prefixed tag — a typo, an rcN, a fork mirror — would otherwise reach
  # the publish jobs. This guard makes publishing structurally conditional on
  # (a) the canonical repo AND (b) a strict vX.Y.Z semver tag.
  tag-guard:
    name: Validate publish trigger (canonical repo + semver tag)
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.check.outputs.publishable }}
    steps:
      - name: Check repository + strict semver tag
        id: check
        run: |
          publishable=false
          if [ "${{ github.repository }}" = "Polycentric-Labs/evidentia" ] \
             && printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            publishable=true
          fi
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"
          echo "repository=${{ github.repository }} ref=$GITHUB_REF -> publishable=$publishable"

  # Tag-time pre-publish gate (v0.10.8 A1). Runs the full SSOT gate suite
  # (scripts/run_gate_suite.py --scope full) on the exact tagged commit. `build`
  # needs: gate, so a red or stale tag can no longer build artifacts or publish.
  gate:
    name: Pre-publish gate (full suite on the tag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (extras for mypy + osv closure)
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-extras --all-packages

      # Copied VERBATIM from the osv-scan job in test.yml (same v2.3.8 binary +
      # SHA256) so run_gate_suite.py's `osv` check finds an identically-pinned
      # scanner on PATH. Pinned by version + SHA256 for Scorecard.
      - name: Install osv-scanner (v2.3.8, checksum-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 \
            -o "$HOME/.local/bin/osv-scanner"
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full gate suite (SSOT)
        run: uv run python scripts/run_gate_suite.py --scope full

  # v0.10.14: build + validate ALL release artifacts BEFORE any publish. Builds
  # the wheels, the SBOM, and the container image (FROM the just-built local
  # wheels), smoke-tests the image, and saves it as an artifact for
  # publish-container to load + push unchanged. No environment + no write scope:
  # it produces artifacts only, so the irreversible publish is fully gated on
  # this job succeeding.
  build:
    name: Build + validate all artifacts (wheels + container)
    needs: [gate, tag-guard]
    if: ${{ needs.tag-guard.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      # The evidentia-api wheel bundles the React SPA built from
      # packages/evidentia-ui; the hatchling build hook drives `npm run build`
      # during `uv build`, so Node must be provisioned.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "20"
          # No npm cache in the release build (zizmor cache-poisoning hardening):
          # a poisoned cache could taint the released wheel's bundled SPA. The
          # release runs rarely, so the cache speedup isn't worth the risk.

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Extract version from tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "semver=${REF#v}" >> "$GITHUB_OUTPUT"

      # SOURCE_DATE_EPOCH-driven reproducible builds (v0.8.3 G4): byte-identical
      # wheels across hosts, which also makes the local-wheel hashes pip-compile
      # computes below match the bytes PyPI will serve.
      - name: Set SOURCE_DATE_EPOCH from tag commit
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          echo "Reproducible-build timestamp: $SOURCE_DATE_EPOCH"

      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Verify reproducible build (build twice + sha256 match)
        run: |
          mkdir -p dist-verify
          uv build --all-packages -o dist-verify
          mismatch=0
          for whl in dist/*.whl; do
            name=$(basename "$whl")
            h1=$(sha256sum "dist/$name" | cut -d' ' -f1)
            h2=$(sha256sum "dist-verify/$name" | cut -d' ' -f1)
            if [ "$h1" = "$h2" ]; then
              echo "MATCH  $name  $h1"
            else
              echo "DIFFER $name  ($h1 vs $h2)"
              mismatch=1
            fi
          done
          rm -rf dist-verify
          if [ "$mismatch" -ne 0 ]; then
            echo "::error::Reproducible-build verification FAILED: wheel hashes diverged"
            exit 1
          fi
          echo "Reproducible-build verification PASSED"

      - name: Check distributions
        run: |
          ls -la dist/
          uvx twine check dist/*

      - name: Verify SPA is bundled
        run: |
          python -c "
          import zipfile, glob, sys
          wheels = [p for p in glob.glob('dist/evidentia_api-*.whl')]
          if not wheels:
              sys.exit('No evidentia-api wheel produced')
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
          spa_files = [n for n in names if n.startswith('evidentia_api/static/') and n.endswith('.html')]
          assert spa_files, f'No SPA HTML in wheel: {names[:20]}'
          print(f'SPA bundled OK: {spa_files}')
          "

      # CycloneDX SBOM for the wheel/sdist surface. Travels with the release-dist
      # artifact (root-level) so publish-pypi can attest it and publish-container
      # can attach it to the Release.
      - name: Generate CycloneDX SBOM
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment \
            -o evidentia-sbom.cdx.json \
            --of JSON \
            --sv 1.6 \
            --pyproject packages/evidentia-core/pyproject.toml \
            "$(uv run python -c 'import sys; print(sys.executable)')"
          echo "SBOM generated:"
          ls -la evidentia-sbom.cdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Regenerate docker/requirements.txt against the JUST-BUILT LOCAL WHEELS.
      # pip-compile resolves evidentia[gui]==<version> from docker/wheels (the
      # local dist/*.whl) + transitive third-party deps from PyPI, with hashes
      # for everything (--generate-hashes). The evidentia-* hashes are therefore
      # the LOCAL wheel bytes — the container installs the exact wheels this job
      # is about to publish, with no PyPI-propagation dependency. pip-compile runs
      # inside the literal image base (python:3.13-slim, NOT 3.14 — litellm
      # requires-python <3.14) for interpreter parity with the --require-hashes
      # install. --find-links is supplied on the Dockerfile install command (NOT
      # emitted here), so requirements.txt carries no machine-specific path.
      - name: Regenerate hash-pinned requirements.txt from LOCAL wheels
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          mkdir -p docker/wheels
          cp dist/*.whl docker/wheels/
          echo "Staged $(ls docker/wheels/*.whl | wc -l) local wheels into docker/wheels/"
          echo "evidentia[gui]==${VERSION}" > docker/requirements.in
          attempts=0
          max_attempts=3
          until docker run --rm -v "$PWD:/work" -w /work python:3.13-slim@sha256:c33f0bc4364a6881bed1ec0cc2665e6c53c87a43e774aaeab88e6f17af105e4f \
                  bash -c "pip install -q pip-tools==7.5.3 && \
                           pip-compile --generate-hashes \
                                       --find-links docker/wheels \
                                       --no-emit-find-links \
                                       --output-file=docker/requirements.txt \
                                       docker/requirements.in"
          do
            attempts=$((attempts + 1))
            if [ "${attempts}" -ge "${max_attempts}" ]; then
              echo "::error::pip-compile from local wheels failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "  pip-compile attempt ${attempts}/${max_attempts} failed, sleeping 15s"
            sleep 15
          done
          echo "Regenerated docker/requirements.txt; evidentia[gui]==${VERSION} pin:"
          grep -E "^evidentia==" docker/requirements.txt | head -2

      - name: Install osv-scanner (v2.3.8, checksum-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 \
            -o "$HOME/.local/bin/osv-scanner"
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Gate the just-regenerated container closure before baking it into the
      # image. The container resolves a DIFFERENT closure than uv.lock, so this
      # catches a vulnerable container dependency pre-publish. Same
      # osv-scanner.toml allowlist as everywhere else.
      - name: osv-scan regenerated container requirements
        run: |
          osv-scanner scan source \
            --config osv-scanner.toml \
            --lockfile docker/requirements.txt

      # Build the container FROM THE LOCAL WHEELS (INSTALL_SOURCE=local). load:true
      # keeps it in the local daemon for smoke-testing + docker save. provenance:
      # false / sbom: false keep the image a plain single-platform manifest so
      # save -> load -> push is digest-stable (the validated image's rootfs is
      # exactly what publish-container pushes).
      - name: Build container image from local wheels (load, not pushed)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: evidentia:rc
          build-args: |
            INSTALL_SOURCE=local
          provenance: false
          sbom: false
          # No type=gha build cache in the release pipeline: the shared Actions
          # cache can be written by a PR-triggered run on a branch, so reading
          # layers from it in an artifact-producing build is a cache-poisoning
          # vector. Matches the disabled uv/npm caches above — a release builds
          # from scratch. (Releases are tag-driven + infrequent; the lost layer
          # cache costs a few minutes, not correctness.)

      - name: Smoke test — `evidentia version`
        run: |
          out=$(docker run --rm evidentia:rc version)
          echo "$out"
          echo "$out" | grep -q "${STEPS_VERSION_OUTPUTS_SEMVER}" \
            || { echo "::error::image version does not match ${STEPS_VERSION_OUTPUTS_SEMVER}"; exit 1; }
        env:
          STEPS_VERSION_OUTPUTS_SEMVER: ${{ steps.version.outputs.semver }}

      - name: Smoke test — `evidentia catalog list`
        run: docker run --rm evidentia:rc catalog list | head -10

      - name: Smoke test — image labels
        run: docker inspect evidentia:rc --format '{{json .Config.Labels}}' | python -m json.tool

      - name: Smoke test — non-root execution
        run: |
          user=$(docker inspect evidentia:rc --format '{{.Config.User}}')
          if [ "$user" != "65532" ]; then
            echo "FAIL: image User is '$user'; expected 65532"; exit 1
          fi
          echo "OK: image runs as uid $user (nonroot)"

      # Save the EXACT validated image for publish-container to load + push.
      # No post-publish rebuild -> what was smoke-tested is what ships.
      - name: Save validated image as an artifact
        run: |
          docker save evidentia:rc | gzip > evidentia-image.tar.gz
          echo "Saved image: $(du -h evidentia-image.tar.gz | cut -f1)"

      # release-dist: wheels + sdists (dist/) at the same layout publish-pypi's
      # provenance + publish steps expect, plus the root-level SBOM. download
      # with path:. in the publish jobs restores dist/ + the SBOM in place.
      - name: Upload release-dist (wheels + sdists + SBOM)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: |
            dist/
            evidentia-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload release-image (validated container tarball)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-image
          path: evidentia-image.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Publish the wheels to PyPI. needs: build, so this irreversible step runs ONLY
  # after the wheels AND the container have built + validated. Generates the SLSA
  # provenance over the downloaded artifacts (byte-identical to what is
  # published) and hands the provenance bundle to publish-container for the
  # Release. The Release itself is NOT created here.
  publish-pypi:
    name: Publish wheels to PyPI
    needs: [build, tag-guard]
    if: ${{ success() && needs.tag-guard.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evidentia/
    permissions:
      # id-token: write — PyPI Trusted Publisher OIDC AND
      #   actions/attest-build-provenance token exchange.
      id-token: write
      # attestations: write — store the SLSA build provenance under the repo's
      #   attestations API so `gh attestation verify` resolves it.
      attestations: write

    steps:
      - name: Download release-dist (wheels + sdists + SBOM)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: .

      - name: Check distributions
        run: |
          ls -la dist/
          uvx twine check dist/*

      # SLSA L3 build provenance over the wheels + sdists + SBOM. The subject
      # files were downloaded above into the same layout the previous single-job
      # design produced (dist/ subdir + root-level SBOM).
      - name: Generate SLSA build provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            evidentia-sbom.cdx.json

      # Hand the provenance bundle to publish-container (which creates the
      # Release) under a stable, recognizable filename.
      - name: Stage + upload SLSA provenance bundle
        run: cp "${STEPS_PROVENANCE_OUTPUTS_BUNDLE_PATH}" evidentia.intoto.jsonl
        env:
          STEPS_PROVENANCE_OUTPUTS_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}

      - name: Upload release-provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-provenance
          path: evidentia.intoto.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Publish to PyPI via Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist/
          # skip-existing so a move-tag re-fire after a partial publish doesn't
          # choke on already-uploaded wheels. Auth/OIDC errors still fail loud.
          skip-existing: true
          verbose: true

  # Load the EXACT image `build` validated, push it to ghcr.io, cosign-sign +
  # SLSA-attest the pushed digest, then create the GitHub Release ONCE with the
  # full body (CHANGELOG + container stanza) + the SBOM + provenance assets. The
  # Release is created LAST so a failure leaves no half-finished Release page.
  publish-container:
    name: Publish container image to ghcr.io + create the GitHub Release
    needs: [publish-pypi, tag-guard]
    if: ${{ success() && needs.tag-guard.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://ghcr.io/polycentric-labs/evidentia
    permissions:
      # contents: write — create the GitHub Release.
      contents: write
      # id-token: write — Fulcio OIDC for cosign keyless + attest token exchange.
      id-token: write
      # attestations: write — store the image SLSA provenance.
      attestations: write
      # packages: write — push to ghcr.io.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "semver=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release-image (validated container tarball)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-image
          path: .

      - name: Download release-dist (for the SBOM Release asset)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: .

      - name: Download release-provenance (SLSA bundle Release asset)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-provenance
          path: .

      - name: Load the validated image
        run: |
          gunzip -c evidentia-image.tar.gz | docker load
          docker image ls evidentia:rc

      # Tag + push the loaded image under both refs (same digest), then read the
      # registry manifest digest back for cosign + attestation.
      - name: Tag + push to ghcr.io
        id: push
        run: |
          REPO=ghcr.io/polycentric-labs/evidentia
          TAG="${STEPS_VERSION_OUTPUTS_TAG}"
          docker tag evidentia:rc "${REPO}:${TAG}"
          docker tag evidentia:rc "${REPO}:latest"
          docker push "${REPO}:${TAG}"
          docker push "${REPO}:latest"
          DIGEST=$(docker buildx imagetools inspect "${REPO}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${REPO}:${TAG} + :latest @ ${DIGEST}"
        env:
          STEPS_VERSION_OUTPUTS_TAG: ${{ steps.version.outputs.tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image with cosign (keyless OIDC)
        env:
          COSIGN_YES: "true"
          STEPS_PUSH_OUTPUTS_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/polycentric-labs/evidentia@${STEPS_PUSH_OUTPUTS_DIGEST}

      - name: Generate SLSA build provenance attestation for image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/polycentric-labs/evidentia
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Build the full Release body: the CHANGELOG [X.Y.Z] block (+ the PEP 740
      # verify stanza the script appends) followed by the container stanza. The
      # Release is created ONCE below, so the body is complete on first creation
      # (no append_body, no double-stanza-on-rerun).
      - name: Assemble Release body
        run: |
          version="${STEPS_VERSION_OUTPUTS_SEMVER}"
          python scripts/extract_changelog_block.py "$version" > release-body.md
          body_size=$(wc -c < release-body.md)
          echo "CHANGELOG block: $body_size bytes"
          if [ "$body_size" -lt 1500 ]; then
            echo "::error::release-body.md is suspiciously small ($body_size bytes); refusing stub release"
            cat release-body.md
            exit 1
          fi
          # Append the container stanza via a literal heredoc (backticks intact),
          # then substitute the tag + digest placeholders.
          cat >> release-body.md <<'STANZA'

          ### Container image

          - `ghcr.io/polycentric-labs/evidentia:__TAG__`
          - `ghcr.io/polycentric-labs/evidentia:latest`
          - Digest: `__DIGEST__`

          **Verify (cosign keyless OIDC):**

          ```bash
          cosign verify ghcr.io/polycentric-labs/evidentia:__TAG__ \
            --certificate-identity-regexp 'https://github\.com/Polycentric-Labs/evidentia/\.github/workflows/release\.yml@refs/tags/v.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          ```

          **Verify (SLSA build provenance):**

          ```bash
          gh attestation verify oci://ghcr.io/polycentric-labs/evidentia:__TAG__ \
            -R Polycentric-Labs/evidentia
          ```

          See [docs/sigstore-quickstart.md](https://github.com/polycentric-labs/evidentia/blob/main/docs/sigstore-quickstart.md)
          for the full verification narrative.
          STANZA
          # __TAG__/__DIGEST__ are the only substitutions — the quoted heredoc
          # kept the backticks + cert-identity regex literal, and the YAML
          # literal block already stripped the base indent so the stanza is
          # flush-left.
          sed -i "s|__TAG__|${STEPS_VERSION_OUTPUTS_TAG}|g; s|__DIGEST__|${STEPS_PUSH_OUTPUTS_DIGEST}|g" release-body.md
          echo "---- assembled release-body.md ----"
          cat release-body.md
        env:
          STEPS_VERSION_OUTPUTS_SEMVER: ${{ steps.version.outputs.semver }}
          STEPS_VERSION_OUTPUTS_TAG: ${{ steps.version.outputs.tag }}
          STEPS_PUSH_OUTPUTS_DIGEST: ${{ steps.push.outputs.digest }}

      - name: Create the GitHub Release (wheels + container, full body)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1 # zizmor: ignore[superfluous-actions]
        with:
          body_path: release-body.md
          files: |
            evidentia-sbom.cdx.json
            evidentia.intoto.jsonl
          fail_on_unmatched_files: false
