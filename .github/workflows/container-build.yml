# Container image build smoke test (v0.7.3 P2 B2 lightweight).
#
# Builds the repo-root `Dockerfile` and validates that the image builds
# end-to-end and that the in-image `evidentia version` + `evidentia
# catalog list` invocations succeed against the latest published
# evidentia wheel from PyPI.
#
# This workflow does NOT publish the built image — publishing to
# `ghcr.io/polycentric-labs/evidentia` happens in release.yml at tag time.
# Running in PR context surfaces any breaking change to the Dockerfile or
# the published evidentia wheel here, not at consumer-pull time.
#
# v0.10.14 — REQUIRABLE restructure (the "dead smoke test" lesson).
#   PREVIOUS DESIGN: `pull_request`/`push` were `paths:`-filtered to
#   `Dockerfile` + this workflow file, so the job only ran when those
#   paths changed. A `paths:`-filtered check CANNOT be a required status
#   check: on a PR that does NOT touch those paths the check never
#   reports, so it sits "Expected" forever and blocks the merge. That is
#   exactly why this smoke test was never made required — and why a
#   chronically-red-then-dead version of it masked the v0.10.12
#   `python:3.14`/litellm base-image regression (Dependabot #83): a
#   non-required gate became noise nobody gated on.
#
#   NEW DESIGN: the job runs on EVERY pull_request + push to `main`
#   (no paths filter) and on the merge queue (merge_group). A first
#   "Determine relevance" step diffs the event's base..head range; when
#   no container-relevant path changed it sets relevant=false and every
#   build/smoke step is skipped via `if:`, but THE JOB STILL COMPLETES
#   SUCCESSFULLY. So `Build + smoke test` always reports a green
#   conclusion on a non-Dockerfile PR — which means it CAN be a required
#   status check without blocking doc-only / code-only PRs, while still
#   running the full build whenever the Dockerfile, docker/, or this
#   workflow change.
#
#   FAIL-SAFE: relevance defaults to TRUE (build) on workflow_dispatch or
#   whenever the base..head range can't be resolved. Skipping a build
#   that SHOULD run is the dangerous direction (it is how the dead smoke
#   test hid #83); a needless build is just a few wasted minutes.

name: Container build smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # merge_group: the merge queue (enabled with the PR-flow ruleset) re-tests
  # the prospective `main` + PR merge. A REQUIRED check must run on this event
  # or the queue stalls waiting for a conclusion that never arrives. The
  # relevance gate below early-exits to SUCCESS for non-container merges.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only on PR iteration (rapid re-pushes to a PR supersede each other).
  # push:[main] + merge_group MUST run to a green conclusion so every main commit
  # earns its own completed check (no misleading cancelled-run noise on rapid merges).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build + smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history so the relevance step can diff the event's
          # base..head range (the base commit is not in a shallow clone).
          fetch-depth: 0
          persist-credentials: false

      # v0.10.14: relevance gate. Diffs the event-appropriate base..head
      # range and sets `relevant=true` iff a container-build input changed
      # (the repo-root Dockerfile, anything under docker/, or this workflow
      # file). Every build/smoke step below is gated on this output, so a
      # non-relevant PR skips the heavy work yet the job still reports
      # SUCCESS — the property that lets this check be `required` without
      # blocking unrelated PRs.
      - name: Determine whether container-relevant paths changed
        id: relevant
        run: |
          event="${{ github.event_name }}"
          base=""
          head=""
          case "$event" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}" ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              head="${GITHUB_EVENT_MERGE_GROUP_HEAD_SHA}" ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}" ;;
          esac

          # Fail-safe: build unconditionally on workflow_dispatch, or when
          # the base/head range can't be resolved (empty, all-zero "no
          # parent" sentinel, or a commit absent from local history). Better
          # a wasted build than a silently-skipped one.
          if [ "$event" = "workflow_dispatch" ] || [ -z "$base" ] || [ -z "$head" ] \
             || printf '%s' "$base" | grep -qE '^0+$' \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null \
             || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Building unconditionally (event=$event; base/head range unresolved)."
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files in range ${base}..${head}:"
          printf '%s\n' "$changed"
          echo "---"
          if printf '%s\n' "$changed" | grep -qE '^(Dockerfile|docker/|\.github/workflows/container-build\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Container-relevant path changed — running the full build + smoke test."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No container-relevant path changed — skipping build, reporting SUCCESS."
          fi
        env:
          GITHUB_EVENT_MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}

      - name: Set up Docker Buildx
        if: steps.relevant.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # v0.10.13: determine the version from PyPI's latest PUBLISHED
      # release, NOT by parsing the committed docker/requirements.txt.
      #
      # WHY THE CHANGE: the previous `sed` for `evidentia[gui]==X.Y.Z`
      # in docker/requirements.txt broke twice over and silently
      # disabled this entire gate from v0.10.11 onward:
      #   1. FORMAT — pip-compile normalizes the umbrella line to
      #      `evidentia==X.Y.Z` (the `[gui]` extra is expanded into its
      #      transitive deps), so the `evidentia[gui]==` pattern never
      #      matched the regenerated file.
      #   2. STALENESS — bump_version.py advances docker/requirements.in
      #      but not docker/requirements.txt, and release.yml only
      #      regenerates the .txt *ephemerally* at tag time, so the
      #      committed pin froze at the v0.10.11 value.
      # The step therefore exited 1 at version-extraction on EVERY push
      # since v0.10.11 — the smoke test never reached the build step, so
      # a chronically-red gate masked the v0.10.12 `python:3.14` /
      # litellm-`<3.14` regression (Dependabot #83) that a working build
      # would have caught. Querying PyPI is self-correcting: the smoke
      # test always builds against the latest real release, with no
      # dependency on the (preview, perennially-stale) committed pin.
      # This restores the original design intent — "validate the build
      # works against the last published release on every main push" —
      # with an implementation that cannot silently rot.
      - name: Determine latest published evidentia version (from PyPI)
        id: pin
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          # Pure-python fetch+parse (NOT `curl ... | python3`) so the OpenSSF
          # Scorecard Pinned-Dependencies "download-then-run" heuristic does not
          # flag a pipe into an interpreter — urllib here only parses PyPI's
          # JSON metadata, it executes no downloaded code.
          VERSION=$(python3 -c "import json, urllib.request; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/evidentia/json', timeout=30))['info']['version'])")
          if [ -z "${VERSION}" ]; then
            echo "::error::could not determine the latest published evidentia version from PyPI."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building container smoke test against latest published evidentia==${VERSION}"

      - name: Wait for PyPI propagation
        if: steps.relevant.outputs.relevant == 'true'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          # Poll all 7 inter-package deps (the v0.7.14 P2.2 race fix; the
          # v0.10.13 + evidentia-eval fix). evidentia-mcp is intentionally
          # absent: it is not a dependency of evidentia[gui]. Querying PyPI
          # for an already-published version is effectively instant, so this
          # loop only ever waits when the smoke test runs mid-release before
          # propagation completes.
          PACKAGES="evidentia evidentia-core evidentia-ai evidentia-eval evidentia-collectors evidentia-integrations evidentia-api"
          for pkg in $PACKAGES; do
            echo "Waiting for ${pkg}==${VERSION} to appear on PyPI..."
            attempts=0
            max_attempts=30  # 30 * 10s = 5 min cap per package
            until pip index versions "${pkg}" 2>&1 | grep -q "${VERSION}"; do
              attempts=$((attempts + 1))
              if [ "${attempts}" -ge "${max_attempts}" ]; then
                echo ""
                echo "::error::PyPI propagation timed out after 5 min waiting for ${pkg}==${VERSION}."
                echo ""
                echo "Most likely cause: the version-bump commit was pushed without"
                echo "the matching v${VERSION} tag, so release.yml never fired and"
                echo "${pkg}==${VERSION} was never published to PyPI."
                echo ""
                echo "Latest visible on PyPI:"
                pip index versions "${pkg}" 2>&1 | head -3
                exit 1
              fi
              echo "  ${pkg} attempt ${attempts}/${max_attempts}: not yet propagated, sleeping 10s"
              sleep 10
            done
            echo "  ${pkg}==${VERSION} visible on PyPI"
          done
          # Extra safety margin for Fastly mirror lag — even after every index
          # page lists the version, individual mirror nodes can lag by 10-20s
          # before the wheel files themselves are fetchable.
          echo "All packages list ${VERSION}; sleeping 20s for mirror catch-up"
          sleep 20

      # v0.8.4 G4 Path 2: regenerate docker/requirements.txt against PyPI's
      # just-confirmed-propagated wheels BEFORE the docker build. Mirrors
      # release.yml's publish-container regeneration step. The committed
      # docker/requirements.txt is preview state; both release.yml AND this
      # smoke test overwrite it ephemerally so hashes match the bytes the
      # container build's `pip install --require-hashes` actually downloads.
      #
      # --upgrade (F-V109-4): ignore the committed file's pins entirely so
      # the regeneration is genuinely fresh (a stale preview otherwise
      # shipped 0.9.1-era starlette/aiohttp into the image). INTERPRETER
      # PARITY: pip-compile runs under the SAME base (python:3.13-slim, NOT
      # 3.14 — litellm requires-python <3.14) so the resolved+hashed closure
      # is exactly what the image installs.
      - name: Regenerate hash-pinned requirements.txt against PyPI
        if: steps.relevant.outputs.relevant == 'true'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          echo "evidentia[gui]==${VERSION}" > docker/requirements.in
          attempts=0
          max_attempts=3
          until docker run --rm -v "$PWD:/work" -w /work python:3.13-slim@sha256:c33f0bc4364a6881bed1ec0cc2665e6c53c87a43e774aaeab88e6f17af105e4f \
                  bash -c "pip install -q pip-tools==7.5.3 && \
                           pip-compile --generate-hashes \
                                       --upgrade \
                                       --no-emit-find-links \
                                       --output-file=docker/requirements.txt \
                                       docker/requirements.in"
          do
            attempts=$((attempts + 1))
            if [ "${attempts}" -ge "${max_attempts}" ]; then
              echo "::error::pip-compile against PyPI failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "  pip-compile attempt ${attempts}/${max_attempts} failed, sleeping 30s"
            sleep 30
          done
          echo "Regenerated docker/requirements.txt; evidentia[gui]==${VERSION} hashes:"
          grep -A2 "^evidentia\[gui\]==" docker/requirements.txt | head -4

      # Copied VERBATIM from the osv-scan job in test.yml / release.yml
      # (same v2.3.8 binary + SHA256) so this container gate scans with
      # an identically-pinned scanner. Pinned by version + SHA256-
      # verified for the OpenSSF Scorecard Pinned-Dependencies signal.
      - name: Install osv-scanner (v2.3.8, checksum-verified)
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64 \
            -o "$HOME/.local/bin/osv-scanner"
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Gate the JUST-REGENERATED docker/requirements.txt before it is
      # baked into the smoke-test image. The container resolves a DIFFERENT
      # closure than uv.lock (pip-compile against the image base), so it can
      # carry a transitively-held vulnerable dep that uv.lock never resolves.
      # Catching it here surfaces a vulnerable container dependency at
      # PR/push time, not at consumer-pull time. Same osv-scanner.toml
      # allowlist as everywhere else, so accepted findings are dispositioned
      # in one place. Exit 1 (vulns found) fails the build.
      - name: osv-scan regenerated container requirements
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          osv-scanner scan source \
            --config osv-scanner.toml \
            --lockfile docker/requirements.txt

      - name: Build image (load into local Docker, not pushed)
        if: steps.relevant.outputs.relevant == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: evidentia:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — `evidentia version`
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          # `evidentia version` is a subcommand (not a `--version` flag).
          # The Typer-driven CLI registers `version` alongside `init`,
          # `doctor`, `serve`, `gap`, `catalog`, `risk`, etc. Using
          # `--version` errors with "No such option: --version".
          docker run --rm evidentia:smoke version

      - name: Smoke test — `evidentia catalog list`
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          # Validate the bundled catalog set ships in the image.
          # `catalog` is the canonical subcommand (not `frameworks`).
          # Pipe to head to limit log noise; we just need to see at
          # least one framework row to know the catalog data made it
          # through the install.
          docker run --rm evidentia:smoke catalog list | head -10

      - name: Smoke test — image labels
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          # Validate the OCI labels are populated (downstream registry
          # tooling reads these for description / license / source).
          docker inspect evidentia:smoke --format '{{json .Config.Labels}}' \
              | python -m json.tool

      - name: Smoke test — non-root execution
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          # DHI is distroless (no `id` binary), so assert the configured user
          # statically via `docker inspect` — no in-image exec. A regression
          # that flips USER to root (uid 0) is caught here.
          user=$(docker inspect evidentia:smoke --format '{{.Config.User}}')
          if [ "$user" != "65532" ]; then
            echo "FAIL: image User is '$user'; expected 65532"
            exit 1
          fi
          echo "OK: image runs as uid $user (nonroot)"
