# CLI<->GUI feature-parity gate (v0.10.8 Phase C-3).
#
# Runs scripts/check_parity.py against docs/cli-gui-parity.yaml on every push
# and PR to main: completeness (every live CLI leaf is classified), api- and
# gui-existence (every `full` row has a real, wired surface), and the
# cli-only debt-ratchet (new CLI-only debt is blocked).
#
# BLOCKING since v0.10.9 (item D): the run step propagates check_parity.py's
# exit code, so a parity regression fails the build. The gate bedded in as
# advisory alongside the v0.10.8 GUI build-out; the same check also runs in
# the tag-time release gate via scripts/run_gate_suite.py --scope full.
#
# Action pinning: every `uses:` line is pinned to a full commit SHA (not a
# tag) to pre-empt the OpenSSF Scorecard PinnedDependencies regression the
# hardening phase cleans up across all workflows. Comments after each SHA
# carry the resolved tag for human review; the SHAs match the repo-wide pins
# in verify-workflow-perms.yml / verify-changelog.yml.
#
# This workflow audits as OK: its top-level permissions are read-only
# (`contents: read`) — the parity job needs no write surface.

name: parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: a required check must run on merge_group or the queue stalls.
  merge_group:
  # Allow manual re-runs from the Actions UI for diagnostic purposes.
  workflow_dispatch:

# Read-only defaults — the parity job has no write surface.
permissions:
  contents: read

jobs:
  parity:
    name: CLI<->GUI parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync workspace
        # --all-packages so evidentia.cli.main.app imports for the live leaf walk.
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-packages

      - name: Run CLI<->GUI parity gate (blocking)
        # BLOCKING: check_parity.py's exit code fails the job on a regression.
        run: uv run --no-sync python scripts/check_parity.py
