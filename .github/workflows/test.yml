name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: a required check must run on the merge_group event or the
  # queue stalls waiting for a conclusion that never arrives (the verified
  # gotcha — see docs/engineering-practices.md / the PR-flow ruleset).
  merge_group:
  # v0.9.4 P4.5: allow operator-triggered manual re-runs so the
  # post-merge "is the merge flake really a flake?" debug loop
  # doesn't require pushing an empty commit. Surfaced during the
  # v0.9.3 ship-cycle investigation of the F-V93-Q4 flaky
  # TestJiraStatus test (gh workflow run had returned HTTP 422).
  workflow_dispatch:

# Default to read-only at the workflow level so each individual job
# follows the principle of least privilege. Jobs that need additional
# permissions (e.g. `actions/upload-artifact`) declare the elevated
# scope locally. Closes the OpenSSF Scorecard
# `actions/missing-workflow-permissions` advisory + reduces blast
# radius on a compromised third-party action.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only on PR iteration (rapid re-pushes to a PR supersede each other).
  # push:[main] + merge_group MUST run to a green conclusion so every main commit
  # earns its own completed check (no misleading cancelled-run noise on rapid merges).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # v0.10.11: gate-fidelity backstop. The collector SSRF guard must fire
  # BEFORE the optional driver import, so the security property holds even
  # with ZERO optional extras installed. This job deliberately syncs WITHOUT
  # --all-extras and asserts the SQL-collector SSRF guard tests still pass,
  # structurally preventing the CI-vs-local extras gap that surfaced at
  # v0.10.10 from masking a guard regression behind a ModuleNotFoundError.
  no-extras-smoke:
    name: pytest no-extras (collector SSRF guard fidelity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace WITHOUT optional extras
        # Deliberately NO --all-extras: prove the SSRF guard is verified with
        # zero optional DB/cloud drivers installed (guard-before-import).
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-packages

      - name: SSRF guard holds with zero drivers
        run: uv run pytest tests/unit/test_collectors/test_collector_ssrf_guard.py::TestSQLCollectorsSSRF -q

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Both the 3.12 and the 3.14 legs are required checks on main: the 3.14
        # legs were promoted in the ruleset on 2026-09-06 after three green
        # main runs (v0.13, V13-22 follow-through).
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          # v0.9.5: disable cache on Windows runners — the Post Install
          # uv cache-save step has shown intermittent tar/zstd failures
          # on Windows that mark the whole job red despite all tests
          # passing (surfaced post-v0.9.4 merge commit a8e061c). uv
          # install itself is fast enough on Windows without the cache;
          # the marginal speedup isn't worth the false-failure noise.
          enable-cache: ${{ matrix.os != 'windows-latest' }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        # Python-only tests — skip the frontend build hook to keep this
        # job Node-free and fast.
        #
        # --all-extras: the collector SSRF/rebind tests
        # (test_collector_ssrf_guard / test_collector_rebind) import the
        # optional DB + cloud drivers (psycopg, pymysql, oracledb, pyodbc,
        # snowflake, databricks) to exercise / monkeypatch the connect path,
        # so the extras MUST be installed or those tests error with
        # ModuleNotFoundError. Matches the mypy job's --all-extras closure
        # (the CI-vs-local gate-fidelity gap that surfaced at v0.10.10).
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-extras --all-packages

      - name: Run tests (with coverage on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest tests/ -q --cov --cov-report=xml --cov-report=term

      - name: Run tests (no coverage on non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest tests/ -q

      # v0.7.10 P2: upload Linux coverage to Codecov for the
      # OpenSSF Silver `test_statement_coverage80` MUST.
      # Failure to upload does NOT fail the build; coverage gate
      # is enforced locally via the .github/codecov.yml `target: 80%`.
      #
      # CODECOV_TOKEN is read from the repo's Actions secrets.
      # As of Codecov v6 (2024+), tokenless uploads from public
      # repos are rate-limited and sometimes silently dropped —
      # the explicit token resolves the "unknown" badge issue.
      # Set via `gh secret set CODECOV_TOKEN --body <token>`
      # after activating at https://app.codecov.io/.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: python
          name: evidentia-python
          slug: polycentric-labs/evidentia
          verbose: true

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-packages

      - name: Run ruff
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  requirements-drift:
    name: docker/requirements drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check for security-sensitive package drift
        run: uv run python scripts/check_requirements_drift.py

  openapi-drift:
    name: openapi schema drift
    runs-on: ubuntu-latest
    # Inherits the top-level `permissions: contents: read`; this job only
    # reads the tree and re-dumps the schema, so no elevated scope.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        # dump_openapi.py imports evidentia_api.app, so the workspace must
        # be installed. Skip the frontend build hook to keep this gate
        # Node-free — the TypeScript half of the parity chain is enforced
        # separately in the `frontend-test` job below.
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-packages

      # First drift-gate of the GUI type-parity chain (see
      # scripts/dump_openapi.py): re-dump the live FastAPI schema and fail
      # if it diverged from the committed openapi.json. The second gate
      # (committed types vs. committed JSON) lives in `frontend-test`.
      - name: Regenerate openapi.json
        run: uv run python scripts/dump_openapi.py

      - name: Fail if openapi.json drifted from the live API schema
        run: |
          if ! git diff --exit-code -- packages/evidentia-ui/openapi.json; then
            echo "::error::packages/evidentia-ui/openapi.json is out of sync with the live FastAPI schema."
            echo "Run 'uv run python scripts/dump_openapi.py', then"
            echo "'npm --prefix packages/evidentia-ui run gen:types' to refresh the types,"
            echo "and commit both packages/evidentia-ui/openapi.json and"
            echo "packages/evidentia-ui/src/types/openapi.ts."
            exit 1
          fi

  osv-scan:
    name: osv-scanner (SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        # --all-extras --all-packages: identical dependency closure to
        # docs/release-checklist.md Step 5, so this CI gate and the
        # documented pre-push gate scan the same SBOM (v0.9.8
        # gate-fidelity lesson — a CI gate and its checklist counterpart
        # must run the same check).
        run: uv sync --all-extras --all-packages

      # osv-scanner surfaces transitive + DISPUTED advisories that the
      # Dependabot alert feed suppresses (the disputed pyjwt CVE that
      # slipped past v0.9.8's Row 14). Pinned by version + SHA256-
      # verified for the OpenSSF Scorecard Pinned-Dependencies signal.
      - name: Install osv-scanner (v2.4.0, checksum-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 \
            -o "$HOME/.local/bin/osv-scanner"
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run osv-scanner SBOM gate
        run: uv run --no-sync python scripts/run_osv_scan.py

  # ── Supply-chain pilots (NON-required, observe-first) ────────────────
  # Layered model: osv-scanner (above) is the AUTHORITATIVE, enforcing SBOM
  # gate. The two jobs below are uv PREVIEW features run as second opinions
  # with continue-on-error, so a finding / preview breakage / feed issue is
  # OBSERVED, never a merge blocker. Neither job name is in the branch
  # ruleset's required checks. See docs/engineering-practices.md.
  uv-audit:
    name: uv audit (pilot, non-blocking)
    runs-on: ubuntu-latest
    # uv's native advisory audit (preview) as a second opinion to osv-scanner.
    # `uv audit` exits non-zero when advisories are present, so continue-on-
    # error keeps it observe-first. Baseline (accepted): cryptography
    # GHSA-537c (dev-SBOM-scoped) + torch GHSA-rrmf (no fix upstream).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: uv audit (locked)
        # Ignore the accepted baseline so the pilot is GREEN normally and RED
        # only on a NEW advisory (a perpetually-red continue-on-error job would
        # mask new findings). Parity with the osv-scanner allowlist for the same
        # IDs: GHSA-537c (cryptography) is dev-SBOM-scoped + accepted (plain
        # --ignore); GHSA-rrmf (torch) has no upstream fix, so
        # --ignore-until-fixed auto-expires and goes red the moment one ships.
        run: >-
          uv audit --preview-features audit --locked
          --ignore GHSA-537c-gmf6-5ccf
          --ignore-until-fixed GHSA-rrmf-rvhw-rf47

  uv-malware-check:
    name: uv malware check (pilot, non-blocking)
    runs-on: ubuntu-latest
    # Opt-in uv malware check (preview): a sync with UV_MALWARE_CHECK=1 queries
    # OSV MAL advisories for the locked resolution and aborts before install if
    # a package matches known malware. Kept OBSERVE-first in this dedicated
    # non-required job (NOT on the required sync steps) because it's a preview
    # feature performing a live OSV lookup — a match / false positive / feed
    # issue surfaces as a visible signal without blocking merges. Graduate to
    # fail-closed on the required syncs once the feature is GA + observed stable.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync with OSV malware check
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
          UV_MALWARE_CHECK: "1"
        run: uv sync --all-packages --preview-features malware-check

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        # --all-extras is required: without the optional extras
        # installed, mypy resolves sigstore / psycopg / etc. as Any
        # and silently skips type-checking every extra-gated path.
        run: uv sync --all-extras --all-packages

      # v0.2.1: added advisory-only. v0.3.0: flipped to strict — mypy is
      # now a required check. Pydantic plugin enabled via [tool.mypy] in
      # root pyproject.toml gives us correct typing for every
      # `Model.model_validate*` return type. types-PyYAML in the dev
      # group silences the "Library stubs not installed for yaml"
      # errors that used to plague every config-load path.
      # v0.4.0: extend to evidentia-api for the FastAPI layer. The
      # evidentia-ui directory is a Node/Vite project, not a Python
      # workspace member, and is covered by its own TypeScript strict
      # gate in the `frontend-test` job below.
      # v0.9.6 P4.3: extended to evidentia-ai + evidentia-mcp. The
      # Phase 0.3 scout reported 14 errors at v0.9.5 baseline; by the
      # Phase 4.3 re-scout (after Phase 2 + Phase 3 surfaced new
      # cross-package Pydantic models and the workspace re-resolved
      # the typing cache), the error count fell to 0. Adding a
      # `py.typed` marker to evidentia-mcp keeps consumers of the
      # package seeing the type annotations downstream. The gate
      # now covers all 7 evidentia-* packages (excluding evidentia-ui
      # which is a TypeScript / Node workspace member).
      - name: Run mypy
        run: |
          uv run mypy \
            packages/evidentia-core/src/evidentia_core \
            packages/evidentia/src/evidentia \
            packages/evidentia-api/src/evidentia_api \
            packages/evidentia-integrations/src/evidentia_integrations \
            packages/evidentia-collectors/src/evidentia_collectors \
            packages/evidentia-ai/src/evidentia_ai \
            packages/evidentia-mcp/src/evidentia_mcp \
            --strict-optional

  frontend-test:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/evidentia-ui/package-lock.json

      - name: Install frontend deps
        working-directory: packages/evidentia-ui
        # Always `npm ci` — the repo commits package-lock.json so the
        # fallback `npm install` branch is unreachable in CI. Removing
        # it satisfies OpenSSF Scorecard's Pinned-Dependencies signal
        # (`npm install` resolves "latest" of every dep at run-time;
        # `npm ci` strictly honors the committed lockfile).
        run: npm ci --no-audit --no-fund

      # Registry-trust hardening: `npm ci` honors the committed lockfile's
      # CONTENT hashes, but does NOT verify the installed tarballs against
      # npm's registry ECDSA signatures / maintainer Sigstore provenance.
      # `npm audit signatures` closes that npm registry-compromise / account-
      # takeover class (the JS/TS analogue of the Python side's PEP 740).
      # Fail-closed — verified locally: 397 packages signed, 161 attested.
      - name: Verify frontend registry signatures + provenance
        working-directory: packages/evidentia-ui
        run: npm audit signatures

      # Second drift-gate of the GUI type-parity chain (see
      # scripts/dump_openapi.py): regenerate the TypeScript types from the
      # committed openapi.json and fail if the committed types drifted. The
      # first gate (committed JSON vs. the live API) lives in the
      # `openapi-drift` job above.
      - name: Regenerate API types from openapi.json
        working-directory: packages/evidentia-ui
        run: npm run gen:types

      - name: Fail if committed API types drifted from openapi.json
        # Run at the repo root (default working-directory) so the pathspec
        # resolves the same way regardless of the npm working-directory.
        run: |
          if ! git diff --exit-code -- packages/evidentia-ui/src/types/openapi.ts; then
            echo "::error::packages/evidentia-ui/src/types/openapi.ts is out of sync with packages/evidentia-ui/openapi.json."
            echo "Run 'npm --prefix packages/evidentia-ui run gen:types' and commit"
            echo "packages/evidentia-ui/src/types/openapi.ts."
            exit 1
          fi

      - name: TypeScript typecheck
        working-directory: packages/evidentia-ui
        run: npm run typecheck

      - name: Vitest unit tests
        working-directory: packages/evidentia-ui
        # Tests are advisory until v0.4.0-alpha.2 lands the component test
        # suite; `|| true` keeps the build green if there are no tests yet.
        run: npm run test -- --run || true

      - name: Vite production build
        working-directory: packages/evidentia-ui
        run: npm run build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidentia-ui-dist
          path: packages/evidentia-ui/dist/
          retention-days: 7
