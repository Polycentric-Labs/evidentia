# Scheduled re-scan of ALREADY-PUBLISHED artifacts for day-N CVEs.
#
# The release-time osv gate and the per-PR osv gate only catch CVEs KNOWN AT
# RELEASE. A CVE disclosed in a frozen transitive dependency — or in the
# python:3.13-slim container base — AFTER a release is invisible until the next
# release: post-publish-smoke.yml is a one-shot install+`version` smoke (not a
# re-scan), and safeguards-resweep.yml only opens a tracking issue (it scans
# nothing). This workflow closes that day-N window. Weekly, it:
#
#   1. fresh-installs the latest PUBLISHED `evidentia` from PyPI into a clean
#      venv, rebuilds a CycloneDX SBOM from the installed closure (the exact
#      `cyclonedx-py` command release.yml uses), and re-runs the SAME pinned,
#      checksum-verified osv-scanner via the SSOT `scripts/run_osv_scan.py`
#      (so the committed osv-scanner.toml allowlist + expiry warnings apply);
#   2. pulls the published container image and osv-scans it (catches base-image
#      OS-package CVEs the wheel closure does not cover), then applies a
#      FIXABLE-ONLY policy gate (`scripts/check_osv_fixable.py`): the run goes
#      RED only when a detected advisory has an applicable fix ("a fix is now
#      available -> rebuild the image"); the unfixable day-N base-OS CVEs are
#      notify-only, rendered to the job summary for full visibility on a green
#      run. osv-scanner v2 has no native fixable gate and exits non-zero on ANY
#      advisory, so a published image on a full Debian base turns this gate
#      permanently red on day-N "No fix available" distro CVEs — the project's
#      own chronically-red anti-pattern (docs/engineering-practices.md, "Fail
#      closed" + lesson #2). Surface reduction (a minimal glibc base + a
#      scheduled rebuild) is the companion roadmap item.
#
# For the PyPI-closure job (1), an un-allowlisted advisory turns the run RED so a
# maintainer is notified — the project's own continuous-attestation thesis,
# applied to its OWN shipped artifacts. workflow_dispatch allows an on-demand
# rescan of any version.
#
# A third job, sentinel-liveness, independently guards the base-freshness
# sentinel itself: it goes RED if that workflow has not produced a run in 14
# days, so a silently auto-disabled or broken sentinel schedule is caught here
# rather than staying an invisible coverage gap.

name: post-publish rescan

on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC (after the 06:00 Dependabot run)
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to rescan (no leading v, e.g. 0.10.13). Blank = latest on PyPI."
        required: false

# Least-privilege default: jobs only read the tree + (for the image) GHCR.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pypi-rescan:
    name: Rescan published PyPI closure (osv SSOT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for osv-scanner.toml + run_osv_scan.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Copied VERBATIM from release.yml / test.yml (same v2.4.0 binary + SHA256)
      # so the re-scan uses the identically-pinned scanner the gate uses.
      - name: Install osv-scanner (v2.4.0, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 \
            -o "$HOME/.local/bin/osv-scanner"
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fresh-install the published release into a clean venv
        id: install
        env:
          # Pass the dispatch input via env, never interpolated directly into
          # the run-block script text (template-injection — zizmor High).
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT}"
          python -m venv /tmp/rescan
          # [gui,mcp] + the meta base deps = all 8 published packages (the
          # prior `[ai,api,collectors]` extras never existed — pip silently
          # skipped them, so the rescanned closure omitted evidentia-api).
          if [ -n "$VERSION" ]; then
            SPEC="evidentia[gui,mcp]==${VERSION}"
          else
            SPEC="evidentia[gui,mcp]"
          fi
          echo "Installing ${SPEC} from PyPI ..."
          /tmp/rescan/bin/pip install --quiet "${SPEC}"
          INSTALLED=$(/tmp/rescan/bin/python -c "import importlib.metadata as m; print(m.version('evidentia'))")
          echo "Re-scanning published evidentia==${INSTALLED}"
          echo "version=${INSTALLED}" >> "$GITHUB_OUTPUT"

      - name: Build a CycloneDX SBOM from the published closure
        run: |
          set -euo pipefail
          # Same cyclonedx-py invocation as scripts/run_osv_scan.py / release.yml,
          # but pointed at the FRESH venv interpreter so the SBOM reflects the
          # published dependency closure rather than the repo workspace.
          uvx --from cyclonedx-bom cyclonedx-py environment \
            -o /tmp/published-sbom.cdx.json \
            --of JSON \
            --sv 1.7 \
            --pyproject packages/evidentia-core/pyproject.toml \
            /tmp/rescan/bin/python
          echo "SBOM:"; ls -la /tmp/published-sbom.cdx.json

      - name: Re-scan the published SBOM (SSOT scanner + osv-scanner.toml)
        run: |
          set -euo pipefail
          # run_osv_scan.py is stdlib-only; --skip-sbom-gen reuses the SSOT's
          # osv-scanner invocation + allowlist + expiry warnings on the SBOM
          # built above. Exits 1 (RED) on an un-allowlisted advisory.
          python scripts/run_osv_scan.py --skip-sbom-gen --sbom /tmp/published-sbom.cdx.json

  container-rescan:
    name: Rescan published container image (osv)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (for osv-scanner.toml + scripts/check_osv_fixable.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python (for the fixable-only policy script)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install osv-scanner (v2.4.0, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 \
            -o "$HOME/.local/bin/osv-scanner"
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: img
        env:
          # Dispatch input via env, never interpolated into a run block
          # (template-injection — zizmor High).
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT}"
          if [ -n "$VERSION" ]; then TAG="v${VERSION}"; else TAG="latest"; fi
          echo "ref=ghcr.io/polycentric-labs/evidentia:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Pull the published image
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          set -euo pipefail
          echo "Pulling ${IMAGE} ..."
          docker pull "${IMAGE}"

      # Capture the FULL advisory report as JSON; the policy step below decides
      # pass/fail. osv-scanner has no native fixable gate, so we cannot let it
      # set the job result directly — but we MUST distinguish "ran fine, found
      # advisories" from "errored". osv-scanner exits 0 (no advisories) or 1
      # (advisories found — the normal case for an image on a general-purpose
      # base); ANY other code is a scanner failure. Critically, a vuln-DB load
      # error after package extraction exits non-zero yet still writes a
      # structurally-valid but EMPTY `{"results": []}` file — so trusting the
      # file content alone would let an errored scan look like a clean image and
      # pass GREEN (a reachable false negative). We therefore whitelist exit
      # 0/1 and FAIL CLOSED on anything else, here, rather than swallowing it
      # with continue-on-error. `--config` applies osv-scanner.toml so its
      # [[IgnoredVulns]] + `ignoreUntil` time-bound exceptions stay a single
      # definition (vuln-id-level accepts, applied on every scan surface).
      # Default filtering is kept (no `--all-vulns`).
      - name: osv-scan the image (capture JSON; fail closed on scanner error)
        id: scan
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          set -euo pipefail
          echo "Scanning ${IMAGE} (OS + language advisories) -> rescan.json ..."
          rc=0
          # tool-check: ok osv-scanner  (installed by the prior curl step "Install osv-scanner" in this job)
          osv-scanner scan image \
            --config=osv-scanner.toml \
            --format json \
            --output-file rescan.json \
            "${IMAGE}" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::osv-scanner errored (exit ${rc}); a partial/errored scan must not pass — failing closed."
            exit 1
          fi
          echo "osv-scanner completed (exit ${rc}); evaluating fixability next."

      # The doctrine fix: FAIL only when a detected advisory has an APPLICABLE
      # fix (rebuild the published image); unfixable day-N base-OS CVEs are
      # notify-only and rendered to the job summary, so the rescan is an
      # actionable signal instead of a permanently-red gate. Runs only when the
      # scan above succeeded (a scanner error already failed the job, fail-
      # closed); a missing/malformed rescan.json still makes the script exit 2
      # as a defensive backstop. NOTE: this gate is *expected* to go red on the
      # currently-published image (it carries fixable advisories) until the next
      # rebuild clears them — that is the signal working, not a regression.
      - name: Gate on FIXABLE advisories (unfixable = notify-only) + report
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          set -euo pipefail
          python scripts/check_osv_fixable.py rescan.json \
            --image "${IMAGE}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # Sentinel self-liveness (G10 companion): the liveness detector's HOST must
  # not be its own blind spot. This independent weekly job goes RED if the
  # base-freshness sentinel has not produced a run in 14 days (e.g. GitHub's
  # 60-day scheduled-workflow auto-disable, or a broken cron).
  sentinel-liveness:
    name: Sentinel self-liveness (base-freshness ran within 14 days)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Assert base-freshness ran within 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! last=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/base-freshness.yml/runs?per_page=1" \
            -q '.workflow_runs[0].created_at'); then
            echo "::error::runs API unreachable — cannot assert sentinel liveness (transient failure? re-run this job)."
            exit 1
          fi
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "::error::base-freshness has NO runs at all — the sentinel is dead (lesson 9)."
            exit 1
          fi
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "base-freshness last ran ${last} (${age_days}d ago)"
          if [ "$age_days" -gt 14 ]; then
            echo "::error::base-freshness sentinel silent for ${age_days}d (>14d) — investigate (auto-disabled schedule? broken cron?)."
            exit 1
          fi
