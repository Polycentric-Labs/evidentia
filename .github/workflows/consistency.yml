name: consistency

# v0.10.8 A2: mirror the version + docs staleness guards into push/PR CI.
# These three checks (version_consistency + docs_health + readme_releases)
# previously ran ONLY in the local .githooks/pre-push hook, so a PR from a
# clone without the hook configured — or any push that bypassed it — could
# land a stale version reference, a broken doc cross-link, or a stale README
# Recent-Releases block undetected. This workflow runs the SAME SSOT gate
# suite (scripts/run_gate_suite.py --scope consistency) the hook and the
# tag-time release gate use, so the three surfaces cannot drift (the v0.9.8
# gate-fidelity lesson).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: a required check must run on merge_group or the queue stalls.
  merge_group:

# Workflow-level least-privilege default: this job only reads the tree and
# runs the staleness guards, so no elevated scope is needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only on PR iteration (rapid re-pushes to a PR supersede each other).
  # push:[main] + merge_group MUST run to a green conclusion so every main commit
  # earns its own completed check (no misleading cancelled-run noise on rapid merges).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consistency:
    name: staleness guards (version + docs + README)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        # The guards import bump_version + parse the workspace pyprojects, so
        # the workspace must be installed. Skip the frontend build hook to
        # keep this gate Node-free and fast — it runs no TypeScript checks.
        env:
          EVIDENTIA_SKIP_FRONTEND_BUILD: "1"
        run: uv sync --all-packages

      - name: Run consistency gate suite (SSOT)
        run: uv run python scripts/run_gate_suite.py --scope consistency

  # PR-scoped strict docs build (docs-airtightness A1.4). `mkdocs build
  # --strict` fails on a broken internal wiki link or an orphaned (not-in-nav)
  # page. It previously ran ONLY in pages.yml, which triggers on push:[main] +
  # tags — i.e. AFTER merge. So a wiki-breaking PR merged green and only THEN
  # reddened main's Pages build, violating the green-checks MUST. Running the
  # same build here (on pull_request + merge_group) moves that gate before the
  # merge. Build-only: no artifact upload, no deploy — pages.yml still owns the
  # publish. The invocation + docs toolchain mirror pages.yml's build job
  # verbatim (uv sync --group docs -> uv run --no-sync mkdocs build --strict) so
  # the pre-merge gate and the deploy gate can never diverge. Kept a SIBLING job
  # (not a step in `consistency`) so the fast Node-free staleness guards are not
  # slowed by the mkdocs-material install, and so a docs-build failure is
  # attributable on its own line.
  docs-build:
    name: docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Install docs toolchain
        run: uv sync --group docs

      - name: Build site (strict)
        run: uv run --no-sync mkdocs build --strict
