name: secret-scan

# v0.10.8 A4: CI-side secret scan with gitleaks. Complements the local
# pre-push secret scan (scripts/pre_push/check_secrets.sh) — that hook only
# fires for contributors who ran scripts/setup-githooks.sh, whereas this
# workflow scans every push/PR to main server-side, so a committed
# credential is caught even on a clone without the hook. Uses the shared
# .gitleaks.toml (default ruleset + a fixtures/examples allowlist).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: the scan only reads the tree + commit history.
# (gitleaks-action posts a PR summary via the GITHUB_TOKEN below, which is
# scoped per-run by the env block, not by an elevated workflow permission.)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (default ruleset + allowlist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history so gitleaks scans the whole pushed commit range,
          # not just the tip commit (the action diffs the range on push).
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # Auto-issued per run; used for PR-summary commenting + event read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action requires an org license for org-owned repos
          # (Polycentric-Labs/evidentia). Stored as a repo Actions secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The shared config: upstream default rules + the fixtures/examples
          # allowlist. Equivalent to the gitleaks CLI's `--config` flag.
          GITLEAKS_CONFIG: .gitleaks.toml
