name: secret-scan

# v0.10.8 A4 (gitleaks BINARY form): CI-side secret scan with the gitleaks CLI
# binary. Complements the local pre-push secret scan
# (scripts/pre_push/check_secrets.sh) — that hook only fires for contributors
# who ran scripts/setup-githooks.sh, whereas this workflow scans every push/PR
# to main server-side, so a committed credential is caught even on a clone
# without the hook. Uses the shared .gitleaks.toml (upstream default ruleset +
# a fixtures/examples/test-module allowlist).
#
# Uses the gitleaks BINARY (MIT-licensed, free for all use) rather than the
# gitleaks-ACTION, which requires a paid GITLEAKS_LICENSE for organization-
# owned repos (Polycentric-Labs). The binary carries no such gate. Pinned by
# version + SHA256-verified, matching how release.yml pins osv-scanner (the
# OpenSSF Scorecard pinned-dependencies signal).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: the scan only reads the checked-out tree + git history.
# The binary writes its verdict to the job log + exit code — it never needs a
# token (no PR-comment side effect, unlike the action).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (default ruleset + allowlist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Full history so `gitleaks git` scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks (pinned binary, SHA256-verified)
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (scan git history)
        # --redact: never echo a matched secret to the log.
        # Exit 1 on any un-allowlisted finding fails the job.
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
