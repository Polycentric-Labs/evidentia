# CodeQL config for Evidentia advanced setup (v0.7.7 CF3).
#
# Loads the security-extended query suite (matching what default
# setup runs) PLUS our custom python-sanitizers pack which declares
# path-injection sanitizers at the analysis layer (a custom-`.qll`
# sanitizer is the "systemic false positives go in committed config,
# not per-instance dismissals" mechanism — and a code refactor that
# routes a path through a MODELED sanitizer is even better, see #164):
#   - `evidentia_core.security.paths.validate_within`
#     (ValidateWithinSanitizer) — closes the false-positive HIGH
#     alerts #71/#72/#73, AND is the modeled barrier the catalog
#     import write-path routes through (alert #164, see below).
#   - `evidentia_core.catalogs.user_dir.resolve_catalog_path`
#     (ResolveCatalogPathSanitizer) — models the containment-checked /
#     trusted-manifest path this helper returns (defense-in-depth for
#     the catalog read path).
#
# NOTE on #164 (catalog loader read_text): a primary-source CodeQL
# investigation (the SARIF code-flow) showed #164's source is the API
# import endpoint's `payload.framework_id`, flowing
# payload.framework_id -> out_path -> load_evidentia_catalog ->
# read_text. The catalog router's `_validate_framework_id` is the
# first-line shape guard, but an `API::moduleImport(...).getACall()`
# sanitizer does NOT match its INTRA-module callsites, so a `.qll`
# model for it could not fire. The robust fix is therefore a code
# refactor: the import endpoint routes `out_path` through the already-
# modeled `validate_within` (write-path containment), which clears
# #164 via ValidateWithinSanitizer rather than a non-firing model.
#
# To verify the sanitizer is firing, look at the CodeQL job logs
# after a push: the `Analyze` step should show the python-sanitizers
# pack being loaded; the analysis should NOT re-flag the
# validate_within callsites that previously produced #71/#72/#73.

name: "Evidentia CodeQL config"

# Add our local sanitizer pack alongside the default query suites.
# `packs:` accepts both registry-published packs and on-disk paths.
packs:
  python:
    - ./.github/codeql/python-sanitizers

# Path filters: skip generated SPA bundle artifacts; include only
# our source.
paths:
  - packages
  - tests

paths-ignore:
  - packages/evidentia-api/src/evidentia_api/static
  - packages/evidentia-ui/dist
  - packages/evidentia-ui/node_modules
  - "**/*.js.map"
