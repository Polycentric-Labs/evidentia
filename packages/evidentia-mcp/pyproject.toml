[project]
name = "evidentia-mcp"
version = "0.11.2"
description = "Model Context Protocol (MCP) server for Evidentia — exposes gap analysis, risk generation, explanation, and OSCAL emit to MCP-aware AI clients (Claude Desktop, Claude Code, ChatGPT, etc.)"
readme = "README.md"
authors = [{name = "Allen Byrd", email = "allen@allenfbyrd.com"}]
license = "Apache-2.0"
# Ceiling tracks the workspace root cap (litellm <3.14) — see root pyproject.toml for the full rationale + removal trigger; kept in sync by check_version_consistency.py.
requires-python = ">=3.12,<3.14"
keywords = ["grc", "compliance", "mcp", "model-context-protocol", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "evidentia-core>=0.11.2,<0.12.0",
    "evidentia-ai>=0.11.2,<0.12.0",
    "evidentia-collectors>=0.11.2,<0.12.0",
    # MCP Python SDK. Includes FastMCP server scaffolding +
    # protocol types. Floor pinned to 1.27 (the version Evidentia
    # was tested against during v0.8.0 P0.3 development);
    # capped below 2.0 until the SDK reaches a stable 1.x and
    # we have evidence of breaking changes warranting a bump.
    "mcp>=2.0.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/polycentric-labs/evidentia"
Repository = "https://github.com/polycentric-labs/evidentia"
Issues = "https://github.com/polycentric-labs/evidentia/issues"
Changelog = "https://github.com/polycentric-labs/evidentia/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia_mcp"]

# PEP 770: the custom hook embeds sbom/*.cdx.json (generated by
# scripts/gen_package_sboms.py; gitignored; skip-clean when absent)
# into .dist-info/sboms/.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Carry generated SBOMs through the sdist so the sdist->wheel release
# path (`uv build`) can embed them — hatchling's default sdist selection
# respects VCS-ignore. Side effect (accepted): published sdists include
# sbom/*.cdx.json as plain files when generated pre-build.
[tool.hatch.build.targets.sdist]
artifacts = ["sbom/"]

[tool.uv.sources]
evidentia-core = { workspace = true }
evidentia-ai = { workspace = true }
evidentia-collectors = { workspace = true }
