[project]
name = "evidentia"
version = "0.11.1"
description = "Open-source GRC tool: gap analysis, risk statements, evidence collection, web UI, and compliance automation"
readme = "README.md"
authors = [{name = "Allen Byrd", email = "allen@allenfbyrd.com"}]
license = "Apache-2.0"
# Ceiling tracks the workspace root cap (litellm <3.14) — see root pyproject.toml for the full rationale + removal trigger; kept in sync by check_version_consistency.py.
requires-python = ">=3.12,<3.14"
keywords = ["grc", "compliance", "governance", "risk", "oscal", "nist", "soc2", "iso27001"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "evidentia-core>=0.11.1,<0.12.0",
    "evidentia-ai>=0.11.1,<0.12.0",
    # v0.10.5 P9: DFAH eval harness extracted from evidentia-ai.
    # ``evidentia eval`` CLI verbs live here, so the meta-package
    # depends on evidentia-eval directly (not via the evidentia-ai
    # transitive pin) so the verbs work even when the v0.12.0
    # shim removal eventually trims evidentia-ai's runtime dep.
    "evidentia-eval>=0.11.1,<0.12.0",
    "evidentia-collectors>=0.11.1,<0.12.0",
    "evidentia-integrations>=0.11.1,<0.12.0",
    # click 8.2 removed CliRunner's mix_stderr (stderr is now always a separate
    # stream) and typer 0.26 vendors its own click. The test suite and the wiki
    # reference generator (scripts/wiki/sync_reference.py) were updated to match
    # when these caps were lifted (see the typer/click migration). The next
    # breaking release is capped (typer 0.x minors are breaking-prone; click 9.0)
    # so a future bump gets isolated review rather than riding a group bump.
    "typer>=0.26.8,<0.27",
    "click>=8.2,<9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Web UI — installs the FastAPI server + bundled React SPA.
# Usage: `pip install "evidentia[gui]"` or `uv tool install "evidentia[gui]"`,
# then `evidentia serve` to open the local web UI.
gui = ["evidentia-api>=0.11.1,<0.12.0"]
# v0.7.12 P0: cloud-backed WORM storage adapters. Each extra
# pulls in the cloud SDK + maps to the matching evidentia-core
# extra so the WORM impl module imports cleanly. Operators
# typically install only the extra matching their cloud.
worm-s3 = ["evidentia-core[worm-s3]>=0.10.0,<0.11.0"]
worm-azure = ["evidentia-core[worm-azure]>=0.10.0,<0.11.0"]
worm-gcs = ["evidentia-core[worm-gcs]>=0.10.0,<0.11.0"]
# v0.8.0 P0.3: Model Context Protocol (MCP) server. Exposes
# Evidentia's gap-analysis, control-lookup, and gap-diff
# surfaces to MCP-aware AI clients (Claude Desktop, Claude
# Code, ChatGPT Desktop, custom clients) over stdio.
# Usage: `pip install "evidentia[mcp]"`, then `evidentia mcp
# serve`.
mcp = ["evidentia-mcp>=0.11.1,<0.12.0"]

[project.scripts]
evidentia = "evidentia.cli.main:app"
cb = "evidentia.cli.main:app"

[project.urls]
Homepage = "https://github.com/polycentric-labs/evidentia"
Documentation = "https://docs.evidentiagrc.com"
Repository = "https://github.com/polycentric-labs/evidentia"
Changelog = "https://github.com/polycentric-labs/evidentia/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidentia"]
# Ship the bundled example data files (non-.py) so a fresh
# `pip install evidentia` user can run the quickstart with zero setup.
# Resolved at runtime via `importlib.resources.files("evidentia.examples")`.
# Explicit so inclusion does not silently depend on VCS-tracking state.
# The Tier-1 demo runner's argv allowlist ships the same way, resolved via
# `importlib.resources.files("evidentia.demo")` (see demo/runner.py).
artifacts = ["src/evidentia/examples/*.yaml", "src/evidentia/demo/*.yaml"]

# PEP 770: the custom hook embeds sbom/*.cdx.json (generated by
# scripts/gen_package_sboms.py; gitignored; skip-clean when absent)
# into .dist-info/sboms/.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Carry generated SBOMs through the sdist so the sdist->wheel release
# path (`uv build`) can embed them — hatchling's default sdist selection
# respects VCS-ignore. Side effect (accepted): published sdists include
# sbom/*.cdx.json as plain files when generated pre-build.
[tool.hatch.build.targets.sdist]
artifacts = ["sbom/"]

[tool.uv.sources]
evidentia-core = { workspace = true }
evidentia-ai = { workspace = true }
evidentia-eval = { workspace = true }
evidentia-collectors = { workspace = true }
evidentia-integrations = { workspace = true }
evidentia-api = { workspace = true }
evidentia-mcp = { workspace = true }
