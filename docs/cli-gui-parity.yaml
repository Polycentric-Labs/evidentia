# docs/cli-gui-parity.yaml — CLI<->GUI feature-parity manifest.
#
# One row per CLI *leaf* command (the runnable verb, e.g. `gap analyze`, not
# the `gap` group). The manifest is the declarative source of truth that
# scripts/check_parity.py gates against and docs/parity-coverage.md renders.
#
# status enum:
#   full      API op exists AND a dedicated App.tsx route surfaces the feature
#             (route present in App.tsx + wired through lib/api.ts).
#   api-only  API op exists, but no dedicated GUI route surfaces it yet.
#   cli-only  No API op and no GUI — a real parity gap that may earn an
#             API + GUI later. The `baseline` below is the debt-ratchet floor
#             over this set (it must never grow without an explicit
#             `--update-baseline`).
#   exempt    CLI-only *by design* — process/daemon servers, local-only
#             cache/file management, offline signing/verification, MCP-internal
#             tooling. Carries a `reason`; never counts against parity.
#
# Fields:
#   cli     the full leaf path (group(s) + verb), space-separated.
#   api     "METHOD /path" of the backing operation in
#           packages/evidentia-ui/openapi.json, or null.
#   gui     the App.tsx route that surfaces it (e.g. "/gap/analyze"), or null.
#   status  one of the enum values above.
#   reason  (optional) rationale — required for `exempt`, allowed elsewhere.
#
# Seeded 2026-06-02 (v0.10.8 Phase C-1) from LIVE state:
#   * CLI leaves  — walked from evidentia.cli.main.app (Typer), 109 leaves.
#   * api         — packages/evidentia-ui/openapi.json (76 operations).
#   * gui         — packages/evidentia-ui/src/App.tsx routes wired through
#                   packages/evidentia-ui/src/lib/api.ts.
#
# Seed distribution (2026-06-02): 6 full / 49 api-only / 43 cli-only / 11 exempt.
# v0.10.8 Wave 2 flipped 7 leaves api-only -> full (the POA&M / TPRM / ConMon /
# Explain screens): 13 full / 42 api-only / 43 cli-only / 11 exempt (109).
# GUI coverage = full / (full + api-only + cli-only) = 13 / 98 = 13.3%.
# (The "~30% GUI reaches the CLI" figure was API breadth: 55/98 leaves have an
#  API; 13 are now surfaced as a dedicated GUI screen.)
version: 1

# Debt-ratchet floor: the count of `cli-only` rows at seed time. check_parity.py
# fails if the live `cli-only` count exceeds this. The controller lowers it with
# `--update-baseline` whenever a screen ships and a row flips cli-only -> *.
